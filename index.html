<!DOCTYPE html>
<html>
<head>
<title>Find Exact Dish Query Name</title>
<style>
body{font-family:monospace;background:#0D1117;color:#C9D1D9;padding:20px;font-size:13px;}
.ok{color:#3FB950;}.err{color:#F85149;}.warn{color:#E3B341;}.info{color:#58A6FF;}
.box{background:#161B22;border:1px solid #30363D;border-radius:8px;padding:16px;margin:12px 0;}
pre{white-space:pre-wrap;word-break:break-all;line-height:1.9;margin:0;}
button{background:#238636;color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:13px;margin:4px;}
</style>
</head>
<body>
<h2 style="color:#E6EDF3">Find exact Dish query field name</h2>
<p style="color:#8B949E">194 dishes ARE in Neo4j. We need the exact GraphQL query name. Click below:</p>

<div class="box">
  <button onclick="introspect()">Get ALL 26 query field names (introspection)</button>
  <button onclick="testDishVariants()">Test all Dish name variants</button>
  <button onclick="tryDirectCypher()">Try raw schema query</button>
  <pre id="out">Click a button...</pre>
</div>

<script>
const URL="https://9b0f64b5-graphql.production-orch-0336.neo4j.io/graphql";
const KEY="d16v0PBfQhJqLwunefWZuYe9rVhqQusk";

function log(msg,cls=""){
  document.getElementById("out").innerHTML+=`<span class="${cls}">${msg}\n</span>`;
}
function clear(){document.getElementById("out").innerHTML="";}

async function gql(q){
  const r=await fetch(URL,{method:"POST",mode:"cors",
    headers:{"Content-Type":"application/json","x-api-key":KEY},
    body:JSON.stringify({query:q})});
  return r.json();
}

async function introspect(){
  clear();log("Running full introspection...\n","warn");
  const j=await gql(`{ __schema { queryType { fields { name } } } }`);
  if(j.errors){log("ERROR: "+j.errors[0].message,"err");return;}
  const fields=j.data.__schema.queryType.fields;
  log(`Found ${fields.length} query fields:\n`,"ok");
  fields.forEach(f=>{
    const hasDish=/dish/i.test(f.name);
    log(`  ${hasDish?">>> ":"    "}${f.name}`,hasDish?"warn":"");
  });
  log("\n>>> = contains 'dish' — that's your query name","warn");
}

async function testDishVariants(){
  clear();log("Testing ALL possible dish query name variants...\n","warn");
  // Every possible variant Neo4j could generate
  const variants=[
    "{ dishes { name } }",
    "{ dish { name } }",
    "{ Dish { name } }",
    "{ Dishes { name } }",
    "{ dishs { name } }",  // bad pluralisation
    "{ dishess { name } }",
    "{ dishes { name price isVeg spiceLevel mustTry desc } }",
    // Try with just one safe field
    "{ dishes { name price } }",
    "{ dishes { name } }",
    // Maybe it's nested under restaurant?
    "{ restaurants { name servesCategoryCategories { name } } }",
    // Try with connection syntax
    "{ dishesConnection { edges { node { name } } } }",
  ];

  for(const q of variants){
    try{
      const j=await gql(q);
      if(j.errors){
        log(`❌ ${q.substring(0,50)} → ${j.errors[0].message.substring(0,70)}`, "err");
      }else{
        const key=Object.keys(j.data||{})[0];
        const val=j.data[key];
        const count=Array.isArray(val)?val.length:typeof val==="object"?JSON.stringify(val).substring(0,60):"?";
        log(`✅ ${q.substring(0,50)} → ${count} results`, "ok");
      }
    }catch(e){log(`❌ ${q.substring(0,40)} → FETCH ERROR: ${e.message}`,"err");}
  }
}

async function tryDirectCypher(){
  clear();
  log("Getting exact query field list via introspection...\n","info");
  // Get field names + their return types
  const j=await gql(`{
    __schema {
      queryType {
        fields {
          name
          type {
            kind name
            ofType { kind name ofType { kind name } }
          }
        }
      }
    }
  }`);
  if(j.errors){log("Error: "+j.errors[0].message,"err");return;}
  const fields=j.data.__schema.queryType.fields;
  log("All fields with return types:\n","info");
  fields.forEach(f=>{
    const t=f.type?.ofType?.ofType?.name||f.type?.ofType?.name||f.type?.name||"?";
    log(`  ${f.name.padEnd(35)} → ${t}`);
  });
  log("\nLook for any field whose type contains 'Dish'","warn");
}
</script>
</body>
</html>
